name: Docker ECR

# Builds a service image and pushes it to ECR.
#
# The repository name is the service name with no suffix. Its chart goes to a
# separate <name>-chart repository, published by helm-ecr.yaml.
#
# Auth is OIDC. There are no long-lived AWS keys in the calling repo.
#
# The ECR repository itself is not created here. Terraform owns it.

on:
  workflow_call:
    inputs:
      repository:
        description: ECR repository name. Also the image name.
        required: true
        type: string
      role-to-assume:
        description: >-
          IAM role ARN to assume for the ECR push. Defaults to the
          AWS_OIDC_ROLE_ARN secret, which is the right role for every repo in
          the org. Pass one only to push to an account that is not ours.
        required: false
        type: string
        default: ""
      aws-region:
        required: false
        type: string
        default: us-east-1
      context:
        required: false
        type: string
        default: .
      dockerfile:
        required: false
        type: string
        default: Dockerfile
      platforms:
        description: Comma-separated buildx platforms.
        required: false
        type: string
        default: linux/amd64
      push:
        description: Push to ECR. Off means build only.
        required: false
        type: boolean
        default: false
      release-tag-prefix:
        description: >-
          Turns on semver releases. The version is computed from conventional
          commits since the last tag carrying this prefix, published as the only
          image tag, and tagged in the repo as <prefix><version>.

          Empty keeps the old behaviour: a short-sha tag and a moving `latest`.
          That cannot work against an immutable ECR repository, because the
          second push of `latest` is rejected.
        required: false
        type: string
        default: ""
      release-paths:
        description: >-
          Newline-separated paths. Only commits touching them count toward the
          version bump. Empty counts every commit. Ignored unless
          release-tag-prefix is set.
        required: false
        type: string
        default: ""
      release-seed:
        description: >-
          Version to publish the first time, before the stream has any tag.
          Ignored unless release-tag-prefix is set.
        required: false
        type: string
        default: 0.1.0
      release-rc:
        description: >-
          Cut a release candidate instead of a stable release: 0.2.0-rc.1, then
          -rc.2, counting up until 0.2.0 itself is cut. The git tag is marked a
          prerelease.

          Meant for a workflow_dispatch off a feature branch, so a build can be
          published and deployed before it merges. Ignored unless
          release-tag-prefix is set.
        required: false
        type: boolean
        default: false
    outputs:
      image:
        description: The pushed image, digest included. Empty when push is off.
        value: ${{ jobs.build.outputs.image }}
    # Callers pass `secrets: inherit`. Declaring this is what lets actionlint
    # check the `secrets.` reference below.
    secrets:
      AWS_OIDC_ROLE_ARN:
        required: false

permissions:
  contents: read

jobs:
  build:
    name: ${{ inputs.repository }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      # A semver release tags the repo. Read is enough without one, but a job's
      # permissions are fixed before the inputs are known.
      contents: write
    outputs:
      image: ${{ steps.result.outputs.image }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          # next-version reads the tag history to decide the bump.
          fetch-depth: ${{ inputs.release-tag-prefix && 0 || 1 }}

      - name: Compute version
        id: version
        if: inputs.release-tag-prefix != ''
        uses: Fomiller/gh-actions/.github/actions/next-version@main
        with:
          tag-prefix: ${{ inputs.release-tag-prefix }}
          paths: ${{ inputs.release-paths }}
          seed: ${{ inputs.release-seed }}
          rc: ${{ inputs.release-rc }}

      - name: Configure AWS credentials
        if: inputs.push
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ inputs.role-to-assume || secrets.AWS_OIDC_ROLE_ARN }}
          aws-region: ${{ inputs.aws-region }}

      - name: Log in to ECR
        if: inputs.push
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Resolve tags
        id: tags
        env:
          # Empty on a build-only run. The build still needs a name, so it
          # falls back to a local one that is never pushed.
          REGISTRY: ${{ steps.ecr.outputs.registry || 'local' }}
          REPOSITORY: ${{ inputs.repository }}
          VERSION: ${{ steps.version.outputs.version }}
          ALREADY_RELEASED: ${{ steps.version.outputs.released }}
          PUSH: ${{ inputs.push }}
        run: |
          set -euo pipefail
          push="$PUSH"
          tags=()
          if [ -n "$VERSION" ]; then
            # One tag, and it never moves. That is the whole point of computing
            # it: an immutable repository rejects a second push of any tag.
            ref="$REGISTRY/$REPOSITORY:$VERSION"
            tags+=("$ref")
            # Re-running a commit that is already released would push a tag that
            # exists. Build it, prove it still builds, push nothing.
            if [ "$ALREADY_RELEASED" = "true" ]; then
              push=false
              echo "$ref is already released; building without pushing." >> "$GITHUB_STEP_SUMMARY"
            fi
          else
            sha=$(git rev-parse --short HEAD)
            ref="$REGISTRY/$REPOSITORY:$sha"
            tags+=("$ref" "$REGISTRY/$REPOSITORY:latest")
          fi
          {
            echo "tags<<EOF"
            printf '%s\n' "${tags[@]}"
            echo "EOF"
            echo "ref=$ref"
            echo "push=$push"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3
        with:
          platforms: ${{ inputs.platforms }}

      - uses: docker/build-push-action@v6
        id: build
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          platforms: ${{ inputs.platforms }}
          push: ${{ steps.tags.outputs.push }}
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - id: result
        if: steps.tags.outputs.push == 'true'
        env:
          REF: ${{ steps.tags.outputs.ref }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          echo "image=$REF@$DIGEST" >> "$GITHUB_OUTPUT"
          echo "Pushed \`$REF\` (\`$DIGEST\`)" >> "$GITHUB_STEP_SUMMARY"

      # After the push, so a registry failure does not leave a tag claiming a
      # release that is not there.
      - name: Tag the release
        if: steps.tags.outputs.push == 'true' && steps.version.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          git tag "$TAG"
          git push origin "$TAG"
          gh release create "$TAG" --title "$TAG" --generate-notes \
            ${{ inputs.release-rc && '--prerelease' || '' }}
