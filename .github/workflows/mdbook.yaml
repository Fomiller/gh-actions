# Builds an mdbook and optionally publishes it to GitHub Pages.
#
# mdbook-version is pinned rather than resolved from the latest release at run
# time, so a docs build is reproducible and a new mdbook release cannot break
# an unrelated PR.
name: mdbook

on:
  workflow_call:
    inputs:
      book-path:
        required: false
        type: string
        default: docs
      mdbook-version:
        required: false
        type: string
        default: '0.5.4'
      deploy:
        description: Publish to Pages. False builds only, for pull requests.
        required: false
        type: boolean
        default: true

jobs:
  # Build and deploy are separate jobs because the github-pages environment is
  # branch-protected. A job that names it fails before it starts when the ref
  # is not the default branch, which would take every pull request with it.
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      # Unpacked into RUNNER_TEMP, not the working directory, so the binary
      # cannot end up in the uploaded artifact.
      - name: Install mdbook
        env:
          VERSION: ${{ inputs.mdbook-version }}
        run: |
          set -euo pipefail
          url="https://github.com/rust-lang/mdbook/releases/download/v${VERSION}/mdbook-v${VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          mkdir -p "$RUNNER_TEMP/mdbook"
          curl -sSfL "$url" | tar -xz --directory="$RUNNER_TEMP/mdbook"
          echo "$RUNNER_TEMP/mdbook" >> "$GITHUB_PATH"

      - name: Build
        run: mdbook build
        working-directory: ${{ inputs.book-path }}

      - name: Upload artifact
        if: inputs.deploy
        uses: actions/upload-pages-artifact@v5
        with:
          path: ${{ inputs.book-path }}/book

  deploy:
    if: inputs.deploy
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
