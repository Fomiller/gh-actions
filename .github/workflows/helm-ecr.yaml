name: helm-ecr

# Publishes every chart under helm/ to ECR as an OCI artifact.
#
# Charts are discovered, not listed. Any directory holding a Chart.yaml is a
# chart, so adding one is a matter of adding the directory.
#
# The ECR repository name is Chart.yaml's `name`, which must end in -chart so a
# service's chart repo stays distinct from its image repo. The suffix lives in
# Chart.yaml rather than being appended here because `helm push` reads the
# repository name out of the packaged chart — appending at push time would make
# the published chart disagree with what `helm template` renders locally.
#
# The chart version comes from Chart.yaml by default. Set release-versioning to
# compute it from conventional commits instead; Chart.yaml then holds a
# placeholder that CI overwrites before packaging, and the repo never carries a
# version that disagrees with what was published.
#
# The role arn comes from the AWS_OIDC_ROLE_ARN secret, same as ecr.yaml and
# terragrunt.yaml. Every chart lands in the same account, so making each caller
# name the role only meant the arn had to be rotated in every repo at once.
#
# The ECR repositories themselves are not created here. Terraform owns them.

on:
  workflow_call:
    inputs:
      role-to-assume:
        description: >-
          IAM role ARN to assume for the ECR push. Defaults to the
          AWS_OIDC_ROLE_ARN secret, which is the right role for every repo in
          the org. Pass one only to push to an account that is not ours.
        required: false
        type: string
        default: ""
      aws-region:
        required: false
        type: string
        default: us-east-1
      chart-root:
        description: Directory holding one subdirectory per chart.
        required: false
        type: string
        default: helm
      push:
        description: Push to ECR. Off means lint and package only.
        required: false
        type: boolean
        default: false
      release-versioning:
        description: >-
          Compute each chart's version from conventional commits instead of
          reading it from Chart.yaml. The tag prefix is "<chart name>-v", so two
          charts in one repo are two independent release streams, and neither
          sees the image's tags. Only commits touching the chart's own directory
          count toward its bump.

          The first release of a stream publishes Chart.yaml's committed version
          as-is rather than bumping it, so turning this on does not skip a
          version on a chart that is already published.
        required: false
        type: boolean
        default: false
      release-rc:
        description: >-
          Cut a release candidate instead of a stable release: 0.2.0-rc.1, then
          -rc.2, counting up until 0.2.0 itself is cut. The git tag is marked a
          prerelease.

          Meant for a workflow_dispatch off a feature branch. Ignored unless
          release-versioning is on.
        required: false
        type: boolean
        default: false
    outputs:
      charts:
        description: JSON matrix of the discovered charts.
        value: ${{ jobs.discover.outputs.matrix }}
    # Callers pass `secrets: inherit`. Declaring this is what lets actionlint
    # check the `secrets.` reference below.
    secrets:
      AWS_OIDC_ROLE_ARN:
        required: false

permissions:
  contents: read

jobs:
  discover:
    name: Discover charts
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.discover.outputs.matrix }}
      has-charts: ${{ steps.discover.outputs.has-charts }}
    steps:
      - uses: actions/checkout@v4

      - id: discover
        env:
          CHART_ROOT: ${{ inputs.chart-root }}
        run: |
          set -euo pipefail
          entries=()
          shopt -s nullglob
          for chart in "$CHART_ROOT"/*/Chart.yaml; do
            dir=$(dirname "$chart")
            name=$(yq -r '.name' "$chart")
            version=$(yq -r '.version' "$chart")
            if [ -z "$name" ] || [ "$name" = "null" ]; then
              echo "$chart has no name" >&2
              exit 1
            fi
            if [ -z "$version" ] || [ "$version" = "null" ]; then
              echo "$chart has no version" >&2
              exit 1
            fi
            case "$name" in
              *-chart) ;;
              *)
                echo "$chart is named '$name'; chart names must end in -chart" >&2
                exit 1
                ;;
            esac
            entries+=("$(jq -nc \
              --arg name "$name" \
              --arg version "$version" \
              --arg path "$dir" \
              '{name:$name, version:$version, path:$path}')")
          done

          matrix=$(printf '%s\n' "${entries[@]+"${entries[@]}"}" | jq -sc '{include: .}')
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

          count=$(jq -r '.include | length' <<< "$matrix")
          if [ "$count" -gt 0 ]; then
            echo "has-charts=true" >> "$GITHUB_OUTPUT"
          else
            echo "has-charts=false" >> "$GITHUB_OUTPUT"
            echo "No Chart.yaml found under $CHART_ROOT/." >> "$GITHUB_STEP_SUMMARY"
          fi

  publish:
    name: ${{ matrix.name }}
    needs: discover
    # An empty matrix is a job configuration error, not an empty run, so the
    # guard has to be here rather than on the strategy.
    if: needs.discover.outputs.has-charts == 'true'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      # A computed version tags the repo. Read is enough without one, but a
      # job's permissions are fixed before the inputs are known.
      contents: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.discover.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          # next-version reads the tag history to decide the bump. Quoted: an
          # unquoted 0 is falsy, so `&& 0 || 1` returns 1 and the clone comes
          # back shallow with no tags to read.
          fetch-depth: ${{ inputs.release-versioning && '0' || '1' }}

      - name: Compute version
        id: version
        if: inputs.release-versioning
        uses: Fomiller/gh-actions/.github/actions/next-version@main
        with:
          tag-prefix: ${{ matrix.name }}-v
          paths: ${{ matrix.path }}
          # Chart.yaml's committed version is where a stream with no tag starts.
          seed: ${{ matrix.version }}
          rc: ${{ inputs.release-rc }}

      - name: Stamp Chart.yaml
        if: steps.version.outputs.version != ''
        env:
          CHART_PATH: ${{ matrix.path }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          # appVersion tracks the chart version here. A chart in this repo ships
          # its own service, so the two never diverge.
          yq -i ".version = \"$VERSION\" | .appVersion = \"$VERSION\"" "$CHART_PATH/Chart.yaml"

      # Pinned on purpose. helm 4.2.4 emits a blank line before `---` where
      # 4.2.3 does not, so an unpinned helm breaks consumers' snapshot tests
      # whenever the runner image moves.
      - uses: azure/setup-helm@v4
        with:
          version: v3.16.3

      - name: Lint
        env:
          CHART_PATH: ${{ matrix.path }}
        run: helm lint "$CHART_PATH"

      - name: Package
        env:
          CHART_PATH: ${{ matrix.path }}
        run: helm package "$CHART_PATH" --destination dist

      - name: Configure AWS credentials
        if: inputs.push
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ inputs.role-to-assume || secrets.AWS_OIDC_ROLE_ARN }}
          aws-region: ${{ inputs.aws-region }}
          role-duration-seconds: 1200

      - name: Log in to ECR
        if: inputs.push
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Push
        # A commit that is already released has nothing to publish. Lint and
        # package still ran, so the chart is proven; only the push is skipped.
        if: inputs.push && steps.version.outputs.released != 'true'
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          CHART_NAME: ${{ matrix.name }}
          CHART_VERSION: ${{ steps.version.outputs.version || matrix.version }}
        run: |
          set -euo pipefail
          # helm push takes the repository name from the chart, so the target
          # is the registry root and the artifact lands at <registry>/<name>.
          helm push "dist/$CHART_NAME-$CHART_VERSION.tgz" "oci://$REGISTRY"
          echo "Pushed \`$REGISTRY/$CHART_NAME:$CHART_VERSION\`" >> "$GITHUB_STEP_SUMMARY"

      # After the push, so a registry failure does not leave a tag claiming a
      # release that is not there.
      - name: Tag the release
        if: inputs.push && steps.version.outputs.released == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          git tag "$TAG"
          git push origin "$TAG"
          gh release create "$TAG" --title "$TAG" --generate-notes \
            ${{ inputs.release-rc && '--prerelease' || '' }}
